name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore UnitRegistry.slnx

      - name: Build solution
        run: dotnet build UnitRegistry.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test UnitRegistry.slnx --configuration Release --no-build
